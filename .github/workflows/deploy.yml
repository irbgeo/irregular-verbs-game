name: deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # vk-miniapps-deploy may wait for input (e.g. a confirmation code); do not hang forever.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make deploy
        env:
          MINI_APPS_ACCESS_TOKEN: ${{ secrets.MINI_APPS_ACCESS_TOKEN }}
          MINI_APPS_APP_ID: ${{ vars.MINI_APPS_APP_ID }}
          MINI_APPS_ENVIRONMENT: ${{ vars.MINI_APPS_ENVIRONMENT || 'production' }}
